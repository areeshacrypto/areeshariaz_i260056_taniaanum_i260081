<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="images/log.png">

    document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--navigation bar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/log.png" height="60" alt="convenelogo"></a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link " href="news.html">News</a></li>
        <li class="nav-item"><a class="nav-link " href="events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link " href="clubs.html">Clubs</a></li>
        <li class="nav-item"><a class="nav-link " href="resources.html">Resources</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
      <button id="themeBtn" class="btn btn-outline-light btn-sm ms-lg-3">Dark mode</button>
    </div>
  </div>
</nav>

<div class="container my-5">
  <!-- TELEPHONE ICON INCLUDED IN HEADING -->
  <h1 class="d-flex align-items-center gap-3">
    <img src="images/telephone.png" alt="Telephone" style="width: 70px; height: 70px; object-fit: contain;">
    Contact and Event Proposal
  </h1>

  <div class="row g-4 mt-2">

    <!--form-->
    <div class="col-lg-6">
      <div id="success" class="alert alert-success d-none">Thank you! Your message was sent.</div>
      <form id="form" novalidate>
        <label class="form-label" for="name">Name</label>
        <input class="form-control mb-1" id="name">
        <div class="error text-danger mb-3"></div>

        <label class="form-label" for="email">Email</label>
        <input class="form-control mb-1" id="email">
        <div class="error text-danger mb-3"></div>

        <label class="form-label" for="eventDate">Proposed event date</label>
        <input class="form-control mb-1" id="eventDate" type="date">
        <div class="error text-danger mb-3"></div>

        <label class="form-label" for="message">Message or event description</label>
        <textarea class="form-control mb-1" id="message" rows="4"></textarea>
        <div class="error text-danger mb-3"></div>

        <button class="btn btn-warning" type="submit">Send</button>
      </form>
    </div>

    <div class="col-lg-6">
      <iframe src="https://maps.google.com/maps?q=FAST+NUCES+Islamabad&output=embed" title="University map" width="100%" height="350" style="border:0; border-radius: 12px;"></iframe>
    </div>
  </div>
</div>

<!--footer-->
<footer class="bg-dark text-light text-center py-4 mt-5">
  <p class="mb-1">HIVE Events | hive@university.edu.pk</p>
  <small>&copy; 2026 HIVE IICT PROJECT</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<!--sparkles cursor animation-->
<script src="js/sparkles.js"></script>
</body>
</html>
